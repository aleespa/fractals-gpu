<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>
    <div id="fractal-container">
        <img id="fractal-img" src="" alt="Fractal Explorer">
    </div>

    <div class="glass-panel" id="controls">
        <h1>Fractal Explorer</h1>
        <p class="subtitle">Drag to pan &bull; Scroll to zoom</p>

        <div class="control-group">
            <label for="type-select">Fractal Type</label>
            <select id="type-select"
                style="width: 100%; padding: 6px; background: rgba(0,0,0,0.5); color: white; border: 1px solid var(--glass-border); border-radius: 4px; outline: none; font-family: 'Inter', sans-serif;">
                <option value="0">Mandelbrot Set</option>
                <option value="1">Julia Set</option>
            </select>
        </div>

        <div class="control-group">
            <label for="iterations">Max Iterations: <span id="iter-val">400</span></label>
            <input type="range" id="iterations" min="50" max="3000" step="10" value="400">
        </div>

        <div id="julia-controls" style="display: none;">
            <div class="control-group">
                <label for="cx">Cx: <span id="cx-val">-0.400</span></label>
                <input type="range" id="cx" min="-2.0" max="2.0" step="0.001" value="-0.4">
            </div>
            <div class="control-group">
                <label for="cy">Cy: <span id="cy-val">0.600</span></label>
                <input type="range" id="cy" min="-2.0" max="2.0" step="0.001" value="0.6">
            </div>
        </div>

        <div class="control-group">
            <label for="gradient-bar">Colour Palette</label>
            <div id="gradient-bar"></div>
        </div>

        <div class="stats">
            <div><span>X:</span> <span id="stat-x">-1.4002</span></div>
            <div><span>Y:</span> <span id="stat-y">0.0000</span></div>
            <div><span>Zoom:</span> <span id="stat-z">10x</span></div>
        </div>

        <div class="export-panel">
            <label>Export Image</label>
            <div class="export-row">
                <select id="export-size">
                    <option value="3840x2160" selected>4K (3840 &times; 2160)</option>
                    <option value="7680x4320">8K (7680 &times; 4320)</option>
                    <option value="custom">Custom&hellip;</option>
                </select>
            </div>
            <div class="export-row" id="export-custom" hidden>
                <input type="number" id="export-w" min="16" max="16384" value="3840" aria-label="Width">
                <span class="export-x">&times;</span>
                <input type="number" id="export-h" min="16" max="16384" value="2160" aria-label="Height">
            </div>
            <div class="export-row">
                <select id="export-ss" aria-label="Smoothing">
                    <option value="1">Smoothing: Off</option>
                    <option value="2" selected>Smoothing: 4&times;</option>
                    <option value="4">Smoothing: 16&times;</option>
                </select>
            </div>
            <div class="export-row">
                <input type="number" id="export-iter" min="50" max="100000" placeholder="Iterations: same as view" aria-label="Export iterations">
            </div>
            <button id="export-btn">Export PNG</button>
            <div class="export-status" id="export-status" role="status"></div>
        </div>

        <button id="copy-cmd-btn" style="margin-bottom: 8px;">Copy CLI Command</button>
        <button id="reset-btn">Reset View</button>
    </div>

    <!-- Hidden native color picker -->
    <input type="color" id="native-color-picker"
        style="position:absolute;opacity:0;width:0;height:0;pointer-events:none;">

    <script src="app.js"></script>
</body>

</html>
